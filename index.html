<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyễn Kiều Anh · Lập trình viên fullstack</title>
    <meta
      name="description"
      content="Portfolio của Nguyễn Kiều Anh — lập trình viên fullstack. Flutter, Next.js/TypeScript và Spring Boot."
    />
    <meta name="author" content="Nguyễn Kiều Anh" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Nguyễn Kiều Anh · Lập trình viên fullstack" />
    <meta
      property="og:description"
      content="Portfolio cá nhân: dự án, kỹ năng và kho GitHub công khai của Nguyễn Kiều Anh (@kieuanhdev)."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var locale = localStorage.getItem("locale");
          document.documentElement.lang = locale === "en" ? "en" : "vi";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
